<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Depth | Preview | Grace and Gladness</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<style>.pv-tag{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:14px;font:600 13px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;opacity:.88;pointer-events:none}</style>
<style>
html,body{height:100%} body{overflow:hidden}
.scene{position:fixed;inset:0;overflow:hidden;background:#FBF9EE}
.layer{position:absolute;left:-3%;right:-3%;bottom:-3%;height:calc(100% + 6%);background:url('../../assets/road-watercolor.jpg') 50% 100%/cover no-repeat;will-change:transform;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.far{-webkit-mask-image:linear-gradient(to bottom,transparent 38%,#000 46%,#000 70%,transparent 79%);mask-image:linear-gradient(to bottom,transparent 38%,#000 46%,#000 70%,transparent 79%)}
.near{-webkit-mask-image:linear-gradient(to bottom,transparent 64%,#000 76%);mask-image:linear-gradient(to bottom,transparent 64%,#000 76%)}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(var(--paper-rgb),.96) 0%,rgba(var(--paper-rgb),.7) 18%,rgba(var(--paper-rgb),0) 46%),linear-gradient(to bottom,rgba(var(--veil-rgb),0) 55%,rgba(var(--veil-rgb),.28) 100%)}
@keyframes settle{from{transform:translate3d(0,var(--start),0)}to{transform:none}}
.layer{animation:settle 3.6s cubic-bezier(.2,.7,.2,1) both}
.base{--start:-8px}.far{--start:14px}.near{--start:34px}
.lead{position:relative;z-index:2;text-align:center;padding-top:12vh}
.name{font-weight:600;font-size:clamp(56px,9vw,128px);line-height:.95}.name i{font-weight:500;font-size:.56em}
.tagline{margin-top:16px;font-size:clamp(24px,2.6vw,34px)}
@media (prefers-reduced-motion:reduce){.layer{animation:none;transition:none}}
</style>
</head>
<body>
<main class="scene" aria-hidden="true">
  <div class="layer base" data-depth="5"></div>
  <div class="layer far" data-depth="12"></div>
  <div class="layer near" data-depth="26"></div>
</main>
<div class="lead">
  <h1 class="name"><span class="grace">Grace</span> <i>and</i> <span class="glad">Gladness</span></h1>
  <p class="tagline">Helping hungry believers grow.</p>
</div>
<script>
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var layers = [].slice.call(document.querySelectorAll('.layer')), ready = false;
  setTimeout(function () { ready = true; layers.forEach(function (l) { l.style.animation = 'none'; }); }, 3700);
  addEventListener('pointermove', function (e) {
    if (!ready) return;
    var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    layers.forEach(function (l) { var d = +l.dataset.depth; l.style.transform = 'translate3d(' + (-x * d) + 'px,' + (-y * d * .4) + 'px,0)'; });
  });
})();
</script>
<div class="pv-tag">Preview: depth. Watch it settle, then move your mouse slowly</div>
</body>
</html>

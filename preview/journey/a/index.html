<style>.pv-tag{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:14px;font:600 13px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;opacity:.88;pointer-events:none}</style>
<style>
@view-transition { navigation: auto; }
.banner { view-transition-name: banner; }
.page { view-transition-name: page; }
::view-transition-old(page) { animation: 300ms ease-out both pv-out; }
::view-transition-new(page) { animation: 520ms cubic-bezier(.2,.7,.2,1) both pv-in; }
::view-transition-group(banner) { animation-duration: 800ms; animation-timing-function: cubic-bezier(.2,.7,.2,1); }
@keyframes pv-out { to { opacity: 0; transform: translateY(-8px); } }
@keyframes pv-in { from { opacity: 0; transform: translateY(14px); } }
</style>
</head>

<style>
html, body { height: 100%; }
body { overflow: hidden; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.strip {
  flex: none; display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap;
  padding: 8px clamp(14px, 3vw, 28px); padding-top: max(8px, env(safe-area-inset-top));
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.strip .wordmark { font-size: 22px; padding: 6px 0; }
.strip .here { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; }
.strip .here::before { content: ""; width: 1px; height: 22px; background: var(--line); margin-right: 4px; }
.wip { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--glad); border: 1px solid currentColor; border-radius: 2px; padding: 1px 7px; }
.strip .links { margin-left: auto; display: flex; gap: 2px 20px; font-size: 18px; }
.strip .links a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
.strip .links a:hover { text-decoration: underline; text-underline-offset: 4px; }
iframe { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; display: block; background: #E9DDC2; }
@media (max-width: 720px) {
  .strip { gap: 0 14px; padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: 2px; }
  .strip .wordmark { display: none; }
  .strip .here { font-size: 18px; }
  .strip .here::before { display: none; }
  .strip .links { font-size: 16px; gap: 0 14px; }
}
</style>
